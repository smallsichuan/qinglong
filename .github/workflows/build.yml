name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Check Gradle project
        run: |
          echo "===== Java ====="
          java -version

          echo "===== Gradle ====="
          gradle --version

          echo "===== Project ====="
          ls -la

          echo "===== App ====="
          ls -la app

          echo "===== Wrapper directory ====="
          ls -la gradle/wrapper || true

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type bin

          chmod +x gradlew

          echo "===== Wrapper generated ====="
          ls -la gradlew
          ls -la gradle/wrapper

      - name: Verify Gradle Wrapper
        run: |
          ./gradlew --version

      - name: Clean project
        run: |
          ./gradlew clean --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      - name: Verify APK
        run: |
          echo "===== APK search ====="

          find . \
            -type f \
            -name "*.apk" \
            -print

          echo "===== Expected APK ====="

          ls -lah app/build/outputs/apk/debug/ || true

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "❌ APK was not generated."

            echo "===== Build outputs ====="
            find app/build/outputs \
              -type f \
              -print 2>/dev/null || true

            echo "===== Build directory ====="
            find app/build \
              -maxdepth 5 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "✅ APK generated successfully"

          ls -lh "$APK"

      - name: Prepare APK
        run: |
          mkdir -p output

          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/qinglong-android-debug.apk

          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-android-apk
          path: output/qinglong-android-debug.apk
          retention-days: 30
          if-no-files-found: error
