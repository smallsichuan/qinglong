name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Check project
        run: |
          echo "===== Project files ====="
          ls -la
          echo "===== App files ====="
          ls -la app
          echo "===== Gradle version ====="
          gradle --version

      - name: Build Android APK
        run: |
          echo "===== Clean ====="
          gradle clean --no-daemon

          echo "===== Build app debug APK ====="
          gradle :app:assembleDebug --no-daemon --stacktrace --info

      - name: Check APK output
        run: |
          echo "===== app/build ====="
          find app/build -maxdepth 6 -type f -print 2>/dev/null || true

          echo "===== APK files ====="
          find . -type f -name "*.apk" -print

          echo "===== APK output directory ====="
          ls -lah app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Prepare APK
        run: |
          mkdir -p output

          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp "app/build/outputs/apk/debug/app-debug.apk" \
               "output/qinglong-android-debug.apk"
          else
            echo "❌ app-debug.apk not found!"
            echo "===== Complete outputs ====="
            find app/build/outputs -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "===== Final APK ====="
          ls -lah output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-android-apk
          path: output/qinglong-android-debug.apk
          retention-days: 30
          if-no-files-found: error
