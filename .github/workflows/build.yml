name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew

      - name: Prepare embedded Linux environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          TMP="$RUNNER_TEMP/qinglong-bootstrap"
          mkdir -p "$TMP"

          echo "===== Download PRoot ARM64 ====="
          PROOT_URL="https://sourceforge.net/projects/proot.mirror/files/v5.3.0/proot-v5.3.0-aarch64-static/download"
          PROOT="$TMP/proot-aarch64"
          curl -fL --retry 5 --retry-all-errors "$PROOT_URL" -o "$PROOT"
          chmod +x "$PROOT"
          file "$PROOT"

          echo "===== Download Alpine ARM64 rootfs ====="
          ROOTFS_URL="https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/aarch64/alpine-minirootfs-3.24.1-aarch64.tar.gz"
          ROOTFS="$TMP/linux-rootfs.tar.gz"
          curl -fL --retry 5 --retry-all-errors "$ROOTFS_URL" -o "$ROOTFS"
          curl -fL --retry 5 --retry-all-errors "${ROOTFS_URL}.sha256" -o "$ROOTFS.sha256"
          (cd "$TMP" && sha256sum -c linux-rootfs.tar.gz.sha256)

          cp "$PROOT" app/src/main/assets/proot-aarch64
          cp "$ROOTFS" app/src/main/assets/linux-rootfs.tar.gz

          echo "===== Embedded assets ====="
          ls -lh app/src/main/assets

      - name: Clean
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --info

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          echo "===== APK ====="
          ls -lh "$APK"

          echo "===== APK archive test ====="
          unzip -t "$APK" >/dev/null

          echo "===== Embedded assets in APK ====="
          unzip -l "$APK" | grep -E 'assets/(proot-aarch64|linux-rootfs.tar.gz)'

          echo "===== APK package information ====="
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -20

      - name: Prepare APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/qinglong-android-arm64-debug.apk
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-android-arm64-apk
          path: output/qinglong-android-arm64-debug.apk
          retention-days: 30
          if-no-files-found: error
